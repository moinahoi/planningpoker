# Coolify: runs the prebuilt release images from GHCR (built by .github/workflows/ci.yml).
# Set APP_VERSION (e.g. 1.0.0) in Coolify to pin a release; defaults to the latest release.
services:
  backend:
    image: ghcr.io/moinahoi/planningpoker-server:${APP_VERSION:-latest}
    pull_policy: always
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://backend:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ghcr.io/moinahoi/planningpoker-client:${APP_VERSION:-latest}
    pull_policy: always
    environment:
      - DEPLOYMENT_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://frontend:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
